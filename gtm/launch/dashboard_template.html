<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>atf-launch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      html, body { background: #0b0b0d; }
      body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
      .tabular-nums { font-feature-settings: 'tnum'; }
    </style>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
// atf-launch dashboard — read-only view, data sourced from uploads/dashboard.tsx
// Direction grouping appears once posts have a `direction` field set.

const { useState, useMemo } = React;

const TODAY = '{{TODAY}}';

const DIRECTIONS = {{DIRECTIONS_JSON}};
const DIRECTION_BY_KEY = Object.fromEntries(DIRECTIONS.map(d => [d.key, d]));

const PRODUCTS = {{PRODUCTS_JSON}};

// Posts — only confirmed entries. The 4/20 batch was a single-direction test
// (doc-drift hook). New directions get added when actually tested.
// Drafts for the historical posts are no longer recoverable (lived at
// /tmp/post_drafts_v2.md on a different laptop).
const POSTS = {{POSTS_JSON}};

// Static TODOS = things the recommender can't infer (open replies w/ drafts,
// strategic decisions, investigations, cross-product placeholders).
// Tactical/time-based actions (reply to N comments, re-check at 60min,
// post-mortem after 48h) are emitted by recommendActions() at render time.
const TODOS = [
  { id: 't1',  product: 'first-tree',     text: 'Send drafted reply to r/ClaudeAI Lanky_Hurry1859 "docs don\'t drift, ownership does" critique', done: false, priority: 'now' },
  { id: 't2',  product: 'first-tree',     text: 'Send drafted reply to r/ClaudeAI "post-receive action" commenter',                              done: false, priority: 'now' },
  { id: 't6',  product: 'first-tree',     text: 'Investigate r/AIToolTesting stray post 1sr7a09 origin (u/Ok_Championship8304)',                  done: false, priority: 'later' },
  { id: 't13', product: 'first-tree',     text: 'After 48h llm-wiki data: decide first-tree.ai landing copy (doc-drift vs llm-wiki)',             done: false, priority: 'soon' },
  { id: 't8',  product: 'repo-gardener',  text: 'Demo: before/after PRs on paperclip-tree',                                                       done: false, priority: 'soon' },
  { id: 't9',  product: 'repo-gardener',  text: 'Write launch ROADMAP detail (currently stub)',                                                   done: false, priority: 'soon' },
  { id: 't10', product: 'breeze',         text: 'Confirm breeze repo location after Q1 migration into first-tree',                                done: false, priority: 'soon' },
  { id: 't11', product: 'first-tree-hub', text: 'No active work — placeholder until Q3',                                                          done: true,  priority: 'later' },
];

// Recommender — emits dynamic todos based on POSTS state.
// Returns array of { id, product, text, done: false, priority, auto: true }.
function recommendActions(posts, nowDate) {
  const out = [];
  const now = nowDate.getTime();

  // Per-post tactical actions
  for (const p of posts) {
    if (p.status !== 'live' || !p.posted_at) continue;
    const postedMs = new Date(p.posted_at).getTime();
    if (Number.isNaN(postedMs)) continue;
    const ageMin = Math.round((now - postedMs) / 60000);
    const ageHr = ageMin / 60;
    const sub = p.channel.replace(/^reddit /, '');

    // Reply window: <90min old + has REAL comments (excludes AutoMod, OP self-replies).
    // comments_real is set by hand when refreshing engagement; falls back to comments.
    const realCount = p.comments_real != null ? p.comments_real : p.comments || 0;
    if (ageMin < 90 && realCount > 0) {
      out.push({
        id: `auto-reply-${p.id}`, product: p.product, priority: 'now', done: false, auto: true,
        text: `Reply to ${realCount} real comment${realCount > 1 ? 's' : ''} on ${sub} (${ageMin}min in — engagement window)`,
      });
    }
    // Re-check at 60min
    if (ageMin >= 30 && ageMin < 75) {
      out.push({
        id: `auto-recheck-60-${p.id}`, product: p.product, priority: 'now', done: false, auto: true,
        text: `Re-check engagement on ${sub} at 60min (currently ${p.score || 0} score, ${p.comments || 0} comments at ${ageMin}min)`,
      });
    }
    // Re-check at 24h
    if (ageHr >= 4 && ageHr < 24) {
      out.push({
        id: `auto-recheck-24h-${p.id}`, product: p.product, priority: 'soon', done: false, auto: true,
        text: `Re-check engagement on ${sub} at 24h (now ${ageHr.toFixed(1)}h in, ${p.score || 0} score, ${p.comments || 0} comments)`,
      });
    }
    // Engagement window closed (use REAL comments, not raw)
    if (ageHr >= 24 && realCount === 0 && (p.score || 0) <= 1) {
      out.push({
        id: `auto-archive-${p.id}`, product: p.product, priority: 'later', done: false, auto: true,
        text: `${sub} engagement window closed (24h+ in, ${p.score || 0} score, no real comments) — archive open replies`,
      });
    }
  }

  // Per-direction post-mortem trigger
  const byDir = {};
  for (const p of posts) {
    if (p.status !== 'live' || !p.direction || !p.posted_at) continue;
    (byDir[`${p.product}/${p.direction}`] = byDir[`${p.product}/${p.direction}`] || []).push(p);
  }
  for (const [key, items] of Object.entries(byDir)) {
    const [product, direction] = key.split('/');
    if (items.length < 3) continue;
    const ages = items.map(p => (now - new Date(p.posted_at).getTime()) / 3600000);
    const minAge = Math.min(...ages);
    if (minAge >= 24 && minAge < 72) {
      const totalScore = items.reduce((s, p) => s + (p.score || 0), 0);
      const totalComments = items.reduce((s, p) => s + (p.comments || 0), 0);
      out.push({
        id: `auto-postmortem-${product}-${direction}`, product, priority: 'soon', done: false, auto: true,
        text: `Post-mortem: ${direction} batch (${items.length} posts, ${totalScore} score / ${totalComments} comments) — which performed best, what to test next?`,
      });
    }
  }

  return out;
}

const STATUS_DOT = {
  live: 'bg-emerald-500', scheduled: 'bg-sky-500', drafting: 'bg-amber-500', planned: 'bg-zinc-500', removed: 'bg-rose-500',
};
const STATUS_TEXT = {
  live: 'text-emerald-300', scheduled: 'text-sky-300', drafting: 'text-amber-300', planned: 'text-zinc-400', removed: 'text-rose-300',
};

function StatusPill({ value }) {
  return (
    <span className="inline-flex items-center gap-1.5 text-[11px]">
      <span className={`w-1.5 h-1.5 rounded-full ${STATUS_DOT[value] ?? 'bg-zinc-600'}`}></span>
      <span className={STATUS_TEXT[value] ?? 'text-zinc-400'}>{value}</span>
    </span>
  );
}

function ProductBadge({ value }) {
  const m = { active: 'text-emerald-400', next: 'text-amber-400', future: 'text-zinc-500' };
  return <span className={`text-[10px] uppercase tracking-[0.14em] ${m[value] ?? 'text-zinc-500'}`}>{value}</span>;
}

function ProgressBar({ pct }) {
  return (
    <div className="w-full h-[3px] bg-zinc-900 rounded-full overflow-hidden">
      <div className="h-full bg-zinc-400" style={{ width: `${pct}%` }}></div>
    </div>
  );
}

function PostRow({ post, daysToLaunch }) {
  const [expanded, setExpanded] = useState(false);
  const days = daysToLaunch(post.date);
  const isPast = post.status === 'live' || post.status === 'removed';
  const hasDraftSlot = post.status === 'drafting' || post.status === 'removed';
  const draftPreview = post.draft || '(no draft saved — fill in via Claude Code)';

  return (
    <li className="group">
      <div className="grid grid-cols-12 gap-3 items-baseline text-sm py-2.5">
        <div className="col-span-3 text-xs text-zinc-500 tabular-nums">
          <div>{post.date}</div>
          {days !== null && !isPast && (
            <div className="text-zinc-600 text-[10px]">
              {days < 0 ? `${Math.abs(days)}d ago` : days === 0 ? 'today' : `T-${days}`}
            </div>
          )}
        </div>

        <div className="col-span-6 min-w-0">
          <div className="text-zinc-200 truncate">
            {post.url ? (
              <a href={post.url} target="_blank" rel="noreferrer" className="hover:underline decoration-zinc-600 underline-offset-2">
                {post.channel}
              </a>
            ) : (
              post.channel
            )}
          </div>
          <div className="text-[11px] text-zinc-500 truncate">
            {post.account}
            {post.note && <span className="ml-2 text-zinc-600">· {post.note}</span>}
            {post.reason && <span className="ml-2 text-zinc-600">· {post.reason}</span>}
          </div>
        </div>

        <div className="col-span-3 flex items-center justify-end gap-3 text-[11px] text-zinc-500 tabular-nums">
          {post.status === 'live' && (
            <span>↑{post.score ?? 0} · {post.comments ?? 0}c</span>
          )}
          <StatusPill value={post.status} />
          {hasDraftSlot && (
            <button
              onClick={() => setExpanded(e => !e)}
              className="text-zinc-600 hover:text-zinc-300 text-[11px]"
              title={expanded ? 'hide draft' : 'show draft'}
            >
              {expanded ? '−' : '+'}
            </button>
          )}
        </div>
      </div>

      {hasDraftSlot && expanded && (
        <div className="ml-[25%] mr-[25%] mb-3 p-3 border border-zinc-900 rounded bg-zinc-950">
          <div className="text-[10px] uppercase tracking-[0.14em] text-zinc-600 mb-2">
            {post.status === 'removed' ? 'original draft' : 'draft'}
          </div>
          <div className={`text-[12px] leading-relaxed whitespace-pre-wrap ${post.draft ? 'text-zinc-300' : 'text-zinc-600 italic'}`}>
            {draftPreview}
          </div>
        </div>
      )}
    </li>
  );
}

function Dashboard() {
  const [activeProduct, setActiveProduct] = useState('first-tree');
  const [filterDirection, setFilterDirection] = useState('all');
  const [expandedRemoved, setExpandedRemoved] = useState({}); // { [groupKey]: true }
  const toggleRemoved = (k) => setExpandedRemoved((prev) => ({ ...prev, [k]: !prev[k] }));

  const product = PRODUCTS.find((p) => p.key === activeProduct);
  const productPosts = POSTS.filter(p => p.product === activeProduct);

  const stats = useMemo(() => {
    const live = productPosts.filter(p => p.status === 'live');
    const upcoming = productPosts.filter(p => ['drafting', 'scheduled', 'planned'].includes(p.status));
    const removed = productPosts.filter(p => p.status === 'removed');
    const totalScore = live.reduce((s, p) => s + (p.score || 0), 0);
    const totalComments = live.reduce((s, p) => s + (p.comments || 0), 0);
    return { live: live.length, upcoming: upcoming.length, removed: removed.length, totalScore, totalComments };
  }, [productPosts]);

  const productTodos = useMemo(() => {
    const auto = recommendActions(POSTS, new Date());
    const merged = [...TODOS, ...auto].filter((t) => t.product === activeProduct);
    // de-dupe by id, prefer first occurrence (static wins over auto)
    const seen = new Set();
    return merged.filter(t => (seen.has(t.id) ? false : seen.add(t.id)));
  }, [activeProduct]);

  const daysToLaunch = (date) => {
    if (!date || !date.match(/^\d{4}-\d{2}-\d{2}$/)) return null;
    const t = new Date(TODAY);
    const d = new Date(date);
    return Math.round((d.getTime() - t.getTime()) / (1000 * 60 * 60 * 24));
  };

  // Direction grouping: only group by direction if at least one post has a non-null direction.
  // Untagged posts go in an "untagged" rail. If NO post has a direction, show flat list.
  const taggedDirections = useMemo(() => {
    return Array.from(new Set(productPosts.map(p => p.direction).filter(Boolean)));
  }, [productPosts]);

  const useGrouping = taggedDirections.length > 0;

  const grouped = useMemo(() => {
    if (!useGrouping) return [];
    const dirs = [...taggedDirections];
    const hasUntagged = productPosts.some(p => !p.direction);
    if (hasUntagged) dirs.push(null);

    return dirs
      .filter(d => filterDirection === 'all' || d === filterDirection)
      .map(dirKey => {
        const items = productPosts
          .filter(p => p.direction === dirKey)
          .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        const live = items.filter(p => p.status === 'live');
        return {
          dirKey,
          items,
          counts: {
            total: items.length,
            score: live.reduce((s, p) => s + (p.score || 0), 0),
            comments: live.reduce((s, p) => s + (p.comments || 0), 0),
          },
        };
      });
  }, [productPosts, useGrouping, taggedDirections, filterDirection]);

  // Flat list (when no directions tagged yet)
  const flatPosts = useMemo(
    () => [...productPosts].sort((a, b) => (a.date || '').localeCompare(b.date || '')),
    [productPosts]
  );

  return (
    <div className="min-h-screen bg-[#0b0b0d] text-zinc-200">
      <div className="max-w-6xl mx-auto px-8 py-10 space-y-12">

        <header className="flex items-end justify-between gap-6 border-b border-zinc-900 pb-6">
          <div>
            <div className="text-[10px] uppercase tracking-[0.2em] text-zinc-500 mb-2">launch tracker</div>
            <h1 className="text-3xl font-medium tracking-tight text-zinc-100">atf-launch</h1>
          </div>
          <div className="text-right text-xs text-zinc-500">
            <div>agent-team-foundation</div>
            <div className="tabular-nums">{TODAY}</div>
          </div>
        </header>

        <section>
          <div className="text-[10px] uppercase tracking-[0.2em] text-zinc-500 mb-4">products</div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-px bg-zinc-900 border border-zinc-900 rounded">
            {PRODUCTS.map((p) => {
              const active = activeProduct === p.key;
              return (
                <button
                  key={p.key}
                  onClick={() => { setActiveProduct(p.key); setFilterDirection('all'); }}
                  className={`text-left p-5 transition-colors ${active ? 'bg-zinc-900' : 'bg-[#0b0b0d] hover:bg-zinc-950'}`}
                >
                  <div className="flex items-center justify-between mb-1">
                    <span className={`text-sm font-medium ${active ? 'text-zinc-100' : 'text-zinc-300'}`}>{p.name}</span>
                    <ProductBadge value={p.status} />
                  </div>
                  <div className="text-xs text-zinc-500 line-clamp-1">{p.tagline}</div>
                </button>
              );
            })}
          </div>
        </section>

        <section className="space-y-10">
          <div className="flex items-baseline justify-between gap-6 flex-wrap">
            <div>
              <h2 className="text-2xl font-medium tracking-tight text-zinc-100">{product.name}</h2>
              <p className="text-sm text-zinc-500 mt-1">{product.tagline}</p>
            </div>
            <div className="flex items-center gap-8 text-sm tabular-nums">
              <div>
                <div className="text-xl font-medium text-zinc-100">{stats.live}</div>
                <div className="text-[10px] uppercase tracking-[0.14em] text-zinc-500">live</div>
              </div>
              <div>
                <div className="text-xl font-medium text-zinc-100">{stats.upcoming}</div>
                <div className="text-[10px] uppercase tracking-[0.14em] text-zinc-500">drafting</div>
              </div>
              <div>
                <div className="text-xl font-medium text-zinc-100">{stats.removed}</div>
                <div className="text-[10px] uppercase tracking-[0.14em] text-zinc-500">removed</div>
              </div>
              <div>
                <div className="text-xl font-medium text-zinc-100">{stats.totalScore}</div>
                <div className="text-[10px] uppercase tracking-[0.14em] text-zinc-500">score</div>
              </div>
              <div>
                <div className="text-xl font-medium text-zinc-100">{stats.totalComments}</div>
                <div className="text-[10px] uppercase tracking-[0.14em] text-zinc-500">comments</div>
              </div>
            </div>
          </div>

          <p className="text-sm text-zinc-400 leading-relaxed max-w-3xl">{product.narrative}</p>

          <div className="grid grid-cols-1 lg:grid-cols-[1fr_280px] gap-12">
            <div className="space-y-6">
              <div className="flex items-center justify-between flex-wrap gap-4">
                <div className="text-[10px] uppercase tracking-[0.2em] text-zinc-500">
                  {useGrouping ? 'promotion by direction' : 'promotion'}
                </div>
                {useGrouping && taggedDirections.length > 1 && (
                  <div className="flex items-center gap-px text-[11px] bg-zinc-900 rounded">
                    <button
                      onClick={() => setFilterDirection('all')}
                      className={`px-2.5 py-1 rounded ${filterDirection === 'all' ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-500 hover:text-zinc-300'}`}
                    >
                      all
                    </button>
                    {taggedDirections.map(dk => (
                      <button
                        key={dk}
                        onClick={() => setFilterDirection(dk)}
                        className={`px-2.5 py-1 rounded ${filterDirection === dk ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-500 hover:text-zinc-300'}`}
                      >
                        {DIRECTION_BY_KEY[dk]?.label ?? dk}
                      </button>
                    ))}
                  </div>
                )}
              </div>

              {productPosts.length === 0 ? (
                <div className="text-sm text-zinc-600 py-12 text-center border-y border-zinc-900">
                  no posts yet
                </div>
              ) : !useGrouping ? (
                <>
                  <div className="text-[11px] text-zinc-600 italic">
                    no direction tags yet — add a `direction` field per post in dashboard.tsx to enable grouping
                  </div>
                  {(() => {
                    const visible = flatPosts.filter(p => p.status !== 'removed');
                    const removed = flatPosts.filter(p => p.status === 'removed');
                    const showRemoved = expandedRemoved['__flat'];
                    return (
                      <>
                        <ul className="divide-y divide-zinc-900 border-y border-zinc-900">
                          {visible.map(post => (
                            <PostRow key={post.id} post={post} daysToLaunch={daysToLaunch} />
                          ))}
                          {showRemoved && removed.map(post => (
                            <PostRow key={post.id} post={post} daysToLaunch={daysToLaunch} />
                          ))}
                        </ul>
                        {removed.length > 0 && (
                          <button
                            onClick={() => toggleRemoved('__flat')}
                            className="text-[11px] text-zinc-600 hover:text-zinc-300 mt-2"
                          >
                            {showRemoved ? '▾' : '▸'} {removed.length} removed
                          </button>
                        )}
                      </>
                    );
                  })()}
                </>
              ) : (
                <div className="divide-y divide-zinc-900 border-y border-zinc-900">
                  {grouped.map(({ dirKey, items, counts }) => {
                    const label = dirKey ? (DIRECTION_BY_KEY[dirKey]?.label ?? dirKey) : 'untagged';
                    const visible = items.filter(p => p.status !== 'removed');
                    const removed = items.filter(p => p.status === 'removed');
                    const groupKey = dirKey ?? '__untagged';
                    const showRemoved = expandedRemoved[groupKey];
                    return (
                      <div key={groupKey} className="py-6 grid grid-cols-1 md:grid-cols-[200px_1fr] gap-6">
                        <div>
                          <div className={`text-sm ${dirKey ? 'text-zinc-200' : 'text-zinc-500 italic'}`}>{label}</div>
                          <div className="text-[10px] uppercase tracking-[0.14em] text-zinc-600 mt-1">
                            {counts.total} {counts.total === 1 ? 'post' : 'posts'}
                            {removed.length > 0 && (
                              <span className="text-zinc-700"> · {removed.length} removed</span>
                            )}
                          </div>
                          {(counts.score > 0 || counts.comments > 0) && (
                            <div className="text-[11px] text-zinc-500 tabular-nums mt-3">
                              <div>↑ {counts.score} score</div>
                              <div>{counts.comments} comments</div>
                            </div>
                          )}
                        </div>
                        <div>
                          <ul>
                            {visible.map(post => (
                              <PostRow key={post.id} post={post} daysToLaunch={daysToLaunch} />
                            ))}
                            {showRemoved && removed.map(post => (
                              <PostRow key={post.id} post={post} daysToLaunch={daysToLaunch} />
                            ))}
                          </ul>
                          {removed.length > 0 && (
                            <button
                              onClick={() => toggleRemoved(groupKey)}
                              className="text-[11px] text-zinc-600 hover:text-zinc-300 mt-2"
                            >
                              {showRemoved ? '▾ hide' : '▸ show'} {removed.length} removed
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            <aside className="space-y-6">
              <div className="flex items-baseline justify-between">
                <div className="text-[10px] uppercase tracking-[0.2em] text-zinc-500">todos</div>
                <span className="text-[11px] text-zinc-600 tabular-nums">
                  {productTodos.filter((t) => !t.done).length} open
                </span>
              </div>
              {productTodos.length === 0 ? (
                <div className="text-sm text-zinc-600">no todos</div>
              ) : (
                <div className="space-y-5">
                  {['now', 'soon', 'later'].map((pri) => {
                    const items = productTodos.filter((t) => t.priority === pri);
                    if (items.length === 0) return null;
                    return (
                      <div key={pri}>
                        <div className="text-[10px] uppercase tracking-[0.14em] text-zinc-500 mb-2">{pri}</div>
                        <ul className="space-y-2">
                          {items.map((todo) => (
                            <li key={todo.id} className={`flex items-start gap-2.5 text-sm ${todo.done ? 'opacity-40' : ''}`}>
                              <span className={`mt-1.5 w-1.5 h-1.5 rounded-full flex-shrink-0 ${todo.done ? 'bg-zinc-700' : todo.auto ? 'bg-sky-500' : 'bg-zinc-500'}`}></span>
                              <span className={`leading-snug ${todo.done ? 'line-through text-zinc-500' : 'text-zinc-300'}`}>
                                {todo.auto && <span className="text-[10px] uppercase tracking-[0.12em] text-sky-500 mr-1.5">auto</span>}
                                {todo.text}
                              </span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    );
                  })}
                </div>
              )}
            </aside>
          </div>
        </section>

        <footer className="border-t border-zinc-900 pt-5 text-[11px] text-zinc-600 flex flex-col sm:flex-row justify-between gap-2">
          <span>data snapshot · {TODAY} · engagement re-fetched live · edit via Claude Code</span>
          <span>boil the lake · launch one product at a time</span>
