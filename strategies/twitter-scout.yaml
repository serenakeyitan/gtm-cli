name: "Twitter Scout"
description: "Scan Twitter for trending topics in a niche. Returns top tweets by engagement."
version: "1.0"
author: "growth-cli"

identities:
  scout: { platform: twitter }

params:
  query: { type: str, required: true }
  count: { type: int, default: 20 }

steps:
  - id: search
    type: tool
    platform: twitter
    action: search
    as: $scout
    params:
      query: "{{ params.query }}"
      count: "{{ params.count }}"
