name: "Cross-Platform Search"
description: "Search for a topic across Twitter, Reddit, and HN simultaneously."
version: "1.0"
author: "growth-cli"

identities:
  twitter_account: { platform: twitter, optional: true }

params:
  query: { type: str, required: true }
  count: { type: int, default: 5 }

steps:
  - id: twitter_search
    type: tool
    platform: twitter
    action: search
    as: $twitter_account
    params:
      query: "{{ params.query }}"
      count: "{{ params.count }}"

  - id: reddit_search
    type: tool
    platform: reddit
    action: search
    params:
      query: "{{ params.query }}"
      count: "{{ params.count }}"

  - id: hn_search
    type: tool
    platform: hn
    action: search
    params:
      query: "{{ params.query }}"
      count: "{{ params.count }}"
