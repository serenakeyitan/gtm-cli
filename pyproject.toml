[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-cli"
version = "0.2.0"
description = "Terminal-native go-to-market CLI. Claude Code for marketers."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Serena Key", email = "serena@unispark.dev"},
]
keywords = ["gtm", "go-to-market", "marketing", "automation", "cli", "social-media"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Internet",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0",
    "twikit @ git+https://codeberg.org/phin/twikit",
    "playwright>=1.40",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]
agents = [
    "claude-agent-sdk>=0.1.40",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
gtm = "gtm.cli:main"

[project.urls]
Homepage = "https://github.com/serenakeyitan/gtm-cli"
Repository = "https://github.com/serenakeyitan/gtm-cli"

[tool.setuptools.packages.find]
include = ["gtm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
